<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAFAF8">
<title>Nexstay · Conciergerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --terra:#C17F5A;--terra-dark:#9E6240;--terra-light:rgba(193,127,90,0.12);--terra-mid:rgba(193,127,90,0.25);
  --bg:#FAFAF8;--bg2:#F4F2EE;--bg3:#EDE9E2;--bg4:#E2DDD6;
  --text:#1A1612;--text2:#6B6158;--text3:#B0A89E;
  --green:#3D8C6E;--green-bg:rgba(61,140,110,0.1);
  --red:#C0392B;--red-bg:rgba(192,57,43,0.09);
  --amber:#B8860B;--amber-bg:rgba(184,134,11,0.1);
  --border:rgba(26,22,18,0.08);
  --shadow:0 2px 12px rgba(26,22,18,0.07);--shadow-md:0 4px 24px rgba(26,22,18,0.1);
  --radius:18px;--radius-sm:12px;
  --serif:'Cormorant Garamond',serif;--sans:'DM Sans',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
input,select,textarea{font-family:var(--sans)}
input::placeholder,textarea::placeholder{color:var(--text3)}
button{cursor:pointer;font-family:var(--sans)}

/* LOGO */
.logo{display:flex;align-items:baseline;line-height:1}
.logo .nex{font-family:var(--serif);font-weight:700;color:var(--text)}
.logo .stay{font-family:var(--serif);font-weight:700;color:var(--terra)}
.logo .sub{font-family:var(--sans);font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:2.5px;margin-left:8px;align-self:center}
.logo-lg .nex,.logo-lg .stay{font-size:40px}
.logo-lg .sub{font-size:10px;letter-spacing:3.5px}
.logo-sm .nex,.logo-sm .stay{font-size:22px}
.logo-sm .sub{font-size:8px;letter-spacing:2px;margin-bottom:1px}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg)}
#header{flex-shrink:0;background:rgba(250,250,248,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;z-index:100}
#content{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg2)}
#navbar{flex-shrink:0;background:rgba(250,250,248,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 env(safe-area-inset-bottom,10px);z-index:100;box-shadow:0 -4px 20px rgba(26,22,18,0.05)}

/* AUTH */
#auth{position:fixed;inset:0;background:linear-gradient(160deg,#FAFAF8 0%,#EFE8DF 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:999;overflow-y:auto}
.auth-wrap{width:100%;max-width:400px}
.auth-logo-block{text-align:center;margin-bottom:36px}
.auth-tagline{color:var(--text3);font-size:13px;margin-top:10px;letter-spacing:0.3px}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow-md)}
.progress-bar{display:flex;gap:8px;margin-bottom:26px}
.progress-bar span{flex:1;height:2px;border-radius:2px;background:var(--bg3);transition:background .4s}
.progress-bar span.active{background:var(--terra)}
.step-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:4px;color:var(--text)}
.step-sub{color:var(--text2);font-size:13px;margin-bottom:22px}
.form-row{display:flex;gap:10px}
.form-group{display:flex;flex-direction:column;gap:12px}
.field{width:100%;background:var(--bg2);border:1.5px solid var(--bg4);border-radius:12px;padding:13px 16px;color:var(--text);font-size:15px;outline:none;transition:border-color .25s,background .25s}
.field:focus{border-color:var(--terra);background:#fff}
select.field option{background:#fff;color:var(--text)}
.btn-terra{width:100%;padding:15px;background:var(--terra);border:none;border-radius:13px;color:#fff;font-size:15px;font-weight:700;letter-spacing:0.3px;transition:background .2s;margin-top:20px}
.btn-terra:active{background:var(--terra-dark)}
.auth-switch{text-align:center;color:var(--text2);font-size:13px;margin-top:18px}
.auth-switch span{color:var(--terra);cursor:pointer;font-weight:600}
.auth-demo{text-align:center;color:var(--text3);font-size:11px;margin-top:8px}

/* HEADER BTNS */
.header-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text2);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:var(--shadow)}
.badge-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--terra);border:1.5px solid var(--bg)}

/* NAV */
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);padding:5px 0;font-size:10px;font-weight:600;transition:color .2s;position:relative}
.nav-item.active{color:var(--terra)}
.nav-item svg{width:21px;height:21px;stroke-width:1.8}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--terra);position:absolute;top:3px;right:28%}
.nav-bar{width:16px;height:2px;background:var(--terra);border-radius:1px;margin-top:1px;opacity:0;transition:opacity .2s}
.nav-item.active .nav-bar{opacity:1}

/* PAGE */
.page{padding:18px 16px 32px;min-height:100%}
.section-title{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--text);margin-bottom:13px}

/* HERO */
.hero-card{background:linear-gradient(135deg,var(--terra) 0%,var(--terra-dark) 100%);border-radius:22px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(193,127,90,0.28)}
.hero-card::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.1);pointer-events:none}
.hero-card::after{content:'';position:absolute;bottom:-30px;left:10px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.06);pointer-events:none}
.hero-greeting{color:rgba(255,255,255,0.7);font-size:13px}
.hero-name{color:#fff;font-family:var(--serif);font-size:26px;font-weight:700;margin-top:4px}
.hero-contract{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:rgba(255,255,255,0.18);border-radius:9px;padding:7px 13px;color:#fff;font-size:12px;font-weight:600}

/* STATS */
.stats-row{display:flex;gap:10px;margin-bottom:10px}
.stat-card{flex:1;min-width:0;background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stat-icon{font-size:19px;margin-bottom:8px}
.stat-value{font-size:22px;font-weight:700;color:var(--text);line-height:1}
.stat-label{font-size:11px;color:var(--text2);margin-top:5px}
.stat-sub{font-size:11px;margin-top:4px;color:var(--terra);font-weight:600}

/* FEED */
.feed-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:4px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.feed-item{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--bg2)}
.feed-item:last-child{border-bottom:none}
.feed-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.feed-text{flex:1;font-size:14px;font-weight:500;color:var(--text);line-height:1.4}
.feed-time{font-size:11px;color:var(--text3);flex-shrink:0}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-terra{background:var(--terra-light);color:var(--terra)}

/* ALERTS */
.alert{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.alert-amber{background:var(--amber-bg);border:1px solid rgba(184,134,11,0.2)}
.alert-red{background:var(--red-bg);border:1px solid rgba(192,57,43,0.15)}
.alert-green{background:var(--green-bg);border:1px solid rgba(61,140,110,0.2)}
.alert-title{font-size:14px;font-weight:700;color:var(--text)}
.alert-sub{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5}

/* INVOICES */
.inv-item{display:flex;align-items:center;gap:14px;padding:15px 16px;background:#fff;border:1px solid var(--border);border-radius:16px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .2s}
.inv-item:active{border-color:var(--terra)}
.inv-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.inv-meta{flex:1;min-width:0}
.inv-name{font-size:15px;font-weight:600;color:var(--text)}
.inv-num{font-size:12px;color:var(--text3);margin-top:2px}
.inv-amount{font-size:16px;font-weight:700;color:var(--terra)}

/* INV DETAIL */
.inv-detail{padding:0 16px 32px;background:var(--bg2);min-height:100%}
.back-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--terra);font-size:14px;font-weight:600;padding:18px 0 16px}
.inv-detail-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:var(--shadow-md)}
.inv-detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.inv-detail-label{color:var(--text3);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.inv-detail-id{font-family:var(--serif);color:var(--text);font-size:22px;font-weight:700}
.dashed{border-top:1px dashed var(--bg4);border-bottom:1px dashed var(--bg4);padding:14px 0;margin:16px 0}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.detail-row-label{color:var(--text2)}
.detail-row-val{font-weight:500;color:var(--text)}
.inv-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.inv-total-label{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--text)}
.inv-total-amount{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--terra)}
.btn-outline{width:100%;margin-top:20px;padding:14px;background:var(--terra-light);border:1.5px solid rgba(193,127,90,0.3);border-radius:13px;color:var(--terra);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-outline:active{background:var(--terra-mid)}

/* REVENUES */
.month-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.month-filter::-webkit-scrollbar{display:none}
.month-btn{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1.5px solid var(--bg4);background:#fff;color:var(--text2);font-size:13px;font-weight:600;transition:all .2s}
.month-btn.active{background:var(--terra);border-color:var(--terra);color:#fff}
.rev-hero{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:12px;box-shadow:var(--shadow)}
.rev-hero-label{color:var(--text3);font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.rev-hero-amount{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--text);line-height:1.1;margin:6px 0 4px}
.rev-hero-amount span{color:var(--terra)}
.rings-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.ring-label{font-size:11px;color:var(--text2);font-weight:500}
.chart-wrap{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;border-radius:6px 6px 0 0;transition:height .7s ease}
.bar-label{font-size:10px;color:var(--text3);font-weight:500}
.rev-breakdown{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.rev-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bg2);font-size:14px}
.rev-row:last-child{border-bottom:none}
.rev-dot{width:8px;height:8px;border-radius:50%;margin-right:10px;display:inline-block;flex-shrink:0}

/* MAINTENANCE */
.main-item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.main-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.main-icon-wrap{display:flex;align-items:center;gap:11px}
.main-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.main-type{font-size:15px;font-weight:700;color:var(--text)}
.main-date{font-size:12px;color:var(--text3);margin-top:2px}
.main-note{font-size:13px;color:var(--text2);line-height:1.6;padding-left:53px}
.main-tech{display:flex;align-items:center;gap:7px;margin-top:10px;padding-left:53px}
.tech-chip{background:var(--terra-light);color:var(--terra);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}

/* INFOS */
.info-section{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.info-section-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--bg2);background:var(--bg)}
.info-section-icon{font-size:17px}
.info-section-title{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1.2px;text-transform:uppercase}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--bg2);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text2)}
.info-value{color:var(--text);font-weight:500;text-align:right;max-width:55%;line-height:1.4}
.info-value.hi{color:var(--terra);font-weight:700}

/* ADMIN */
.tab-pills{display:flex;background:var(--bg3);border-radius:13px;padding:3px;margin-bottom:16px;gap:2px}
.tab-pill{flex:1;text-align:center;padding:9px 4px;border-radius:11px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:700;transition:all .2s}
.tab-pill.active{background:#fff;color:var(--terra);box-shadow:var(--shadow)}
.admin-form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.stats-hero{background:linear-gradient(135deg,var(--terra),var(--terra-dark));border-radius:18px;padding:22px;color:#fff;margin-bottom:12px;box-shadow:0 6px 24px rgba(193,127,90,0.28)}
.stats-hero-val{font-family:var(--serif);font-size:36px;font-weight:700}
.stats-hero-label{font-size:13px;opacity:.8;margin-top:4px}
.table-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.table-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bg2);font-size:13px}
.table-row:last-child{border-bottom:none}

/* UTILS */
.spinner{width:30px;height:30px;border:2.5px solid var(--bg3);border-top-color:var(--terra);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .3s ease both}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--text);color:#fff;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:500;z-index:9999;transition:transform .3s ease;white-space:nowrap;box-shadow:var(--shadow-md)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green)}
#toast.error{background:var(--red)}
</style>
</head>
<body>
<div id="toast"></div>

<!-- AUTH -->
<div id="auth">
  <div class="auth-wrap">
    <div class="auth-logo-block">
      <div class="logo logo-lg" style="justify-content:center">
        <span class="nex">Nex</span><span class="stay">stay</span><span class="sub">Conciergerie</span>
      </div>
      <p class="auth-tagline">Votre espace propriétaire · Tunisie</p>
    </div>
    <div class="auth-card" id="authCard"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div id="header">
    <div class="logo logo-sm">
      <span class="nex">Nex</span><span class="stay">stay</span><span class="sub">Conciergerie</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="notifBtn" onclick="goTab('invoices')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge-dot" id="notifDot" style="display:none"></span>
      </button>
      <button class="icon-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div id="content"></div>
  <nav id="navbar">
    <button class="nav-item active" id="nav-dashboard" onclick="goTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Accueil<div class="nav-bar"></div>
    </button>
    <button class="nav-item" id="nav-revenues" onclick="goTab('revenues')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Revenus<div class="nav-bar"></div>
    </button>
    <button class="nav-item" id="nav-invoices" onclick="goTab('invoices')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Factures<div class="nav-bar"></div>
      <span class="nav-dot" id="invDot" style="display:none"></span>
    </button>
    <button class="nav-item" id="nav-maintenance" onclick="goTab('maintenance')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      Entretiens<div class="nav-bar"></div>
    </button>
    <button class="nav-item" id="nav-infos" onclick="goTab('infos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Infos<div class="nav-bar"></div>
    </button>
  </nav>
</div>

<script>
let STATE={user:null,token:null,tab:'dashboard',authMode:'login',authStep:1,authTmp:{}};
let DATA={invoices:[],revenues:[],maintenances:[],infos:null,contract:null};
let selectedInvoice=null,selectedRevIdx=null;

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(STATE.token)opts.headers['Authorization']='Bearer '+STATE.token;
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch('/api'+path,opts);
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Erreur serveur');
  return data;
}

function toast(msg,type='info'){
  const el=document.getElementById('toast');
  el.className=type==='success'?'success':type==='error'?'error':'';

  setTimeout(()=>el.classList.remove('show'),3000);
}

function switchAuth(m){STATE.authMode=m;STATE.authStep=1;renderAuth();}

function nextStep(){
  const email=document.getElementById('rEmail')?.value;
  const pwd=document.getElementById('rPwd')?.value;
  if(!email||!pwd){toast('Remplissez tous les champs','error');return;}
  STATE.authTmp={prenom:document.getElementById('rPre').value,nom:document.getElementById('rNom').value,email,password:pwd,tel:document.getElementById('rTel').value};
  STATE.authStep=2;renderAuth();
}

async function doRegister(){
  const body={...STATE.authTmp,adresse:document.getElementById('rAdr').value,ville:document.getElementById('rVille').value,typeLogement:document.getElementById('rType').value};
  try{const d=await api('POST','/auth/register',body);STATE.user=d.user;STATE.token=d.token;localStorage.setItem('nx_token',d.token);startApp();}
  catch(e){toast(e.message,'error');}
}

async function doLogin(){
  try{const d=await api('POST','/auth/login',{email:document.getElementById('lEmail').value,password:document.getElementById('lPwd').value});
  STATE.user=d.user;STATE.token=d.token;localStorage.setItem('nx_token',d.token);startApp();}
  catch(e){toast(e.message,'error');}
}

async function tryAutoLogin(){
  const token=localStorage.getItem('nx_token');
  if(!token)return;
  STATE.token=token;
  try{STATE.user=await api('GET','/auth/me');startApp();}
  catch{localStorage.removeItem('nx_token');}
}

function logout(){
  localStorage.removeItem('nx_token');STATE.user=null;STATE.token=null;
  document.getElementById('auth').style.display='flex';
  document.getElementById('app').style.display='none';
  renderAuth();
}

function ringSVG(val,label){
  const r=35,circ=2*Math.PI*r,off=circ-((val/100)*circ);
  return `<div class="ring-wrap"><svg width="90" height="90">
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--bg4)" stroke-width="8"/>
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--terra)" stroke-width="8"
      stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" stroke-linecap="round" transform="rotate(-90 45 45)"/>
    <text x="50%" y="50%" text-anchor="middle" dy=".35em" fill="var(--terra)" font-size="14" font-weight="700" font-family="DM Sans,sans-serif">${val}%</text>
  </svg><span class="ring-label">${label}</span></div>`;
}

  try{[stats,owners]=await Promise.all([api('GET','/stats'),api('GET','/owners')]);}catch{}
  window._ow=owners;window._st=stats;
  c.innerHTML=`<div class="page fade-up">
    <div class="tab-pills">
      <button class="tab-pill active" id="apill-stats" onclick="adminTab('stats')">Stats</button>
      <button class="tab-pill" id="apill-invoices" onclick="adminTab('invoices')">Factures</button>
      <button class="tab-pill" id="apill-revenues" onclick="adminTab('revenues')">Revenus</button>
      <button class="tab-pill" id="apill-maint" onclick="adminTab('maint')">Entretiens</button>
    </div>
    <div id="adminBody"></div>
  </div>`;
  adminTab('stats');
}

async function adminTab(tab){
  document.querySelectorAll('.tab-pill').forEach(p=>p.classList.remove('active'));
  const p=document.getElementById('apill-'+tab);if(p)p.classList.add('active');
  const body=document.getElementById('adminBody');
  const owners=window._ow||[],stats=window._st||{};
  const oo=owners.map(o=>`<option value="${o.id}">${o.prenom} ${o.nom}</option>`).join('');
  if(tab==='stats'){
    body.innerHTML=`
      <div class="stats-hero"><div class="stats-hero-val">${(stats.totalRevenue||0).toLocaleString()} DT</div><div class="stats-hero-label">Total revenus nets cumulés</div></div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-icon">👤</div><div class="stat-value">${stats.totalOwners||0}</div><div class="stat-label">Propriétaires</div></div>
        <div class="stat-card"><div class="stat-icon">🧾</div><div class="stat-value">${stats.totalInvoices||0}</div><div class="stat-label">Factures totales</div></div>
      </div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-value" style="color:var(--terra)">${stats.pendingInvoices||0}</div><div class="stat-label">En attente</div></div>
        <div class="stat-card"><div class="stat-icon">🔧</div><div class="stat-value" style="color:var(--amber)">${stats.maintenancePending||0}</div><div class="stat-label">Entretiens planifiés</div></div>
      </div>
      <h3 class="section-title" style="margin-top:16px">Propriétaires (${owners.length})</h3>
      <div class="table-card">${owners.map(o=>`<div class="table-row"><span style="font-weight:600">${o.prenom} ${o.nom}</span><span style="color:var(--text2);font-size:12px">${o.email}</span></div>`).join('')}</div>`;
  }
  if(tab==='invoices'){
    body.innerHTML=`<h3 class="section-title">Nouvelle facture</h3>
      <div class="admin-form">
        <select id="ai-o" class="field"><option value="">— Propriétaire —</option>${oo}</select>
        <input id="ai-m" class="field" placeholder="Période (ex: Mai 2025)">
        <input id="ai-n" class="field" placeholder="Numéro (ex: F-2025-005)">
        <input id="ai-a" class="field" type="number" placeholder="Montant en DT">
        <input id="ai-d" class="field" type="date">
        <select id="ai-s" class="field"><option value="en_attente">En attente</option><option value="payée">Payée</option></select>
        <button class="btn-terra" style="margin-top:0" onclick="aAddInv()">Envoyer la facture</button>
      </div>`;
  }
  if(tab==='revenues'){
    body.innerHTML=`<h3 class="section-title">Publier des revenus</h3>
      <div class="admin-form">
        <select id="ar-o" class="field"><option value="">— Propriétaire —</option>${oo}</select>
        <div style="display:flex;gap:10px"><input id="ar-m" class="field" placeholder="Mois (ex: Juin)"><input id="ar-y" class="field" type="number" placeholder="Année" value="2025"></div>
        <input id="ar-b" class="field" type="number" placeholder="Revenu brut (DT)">
        <input id="ar-n" class="field" type="number" placeholder="Revenu net (DT)">
        <input id="ar-oc" class="field" type="number" placeholder="Taux occupation (%)" min="0" max="100">
        <div style="display:flex;gap:10px"><input id="ar-l" class="field" type="number" placeholder="Nb locataires"><input id="ar-ni" class="field" type="number" placeholder="Nb nuits"></div>
        <button class="btn-terra" style="margin-top:0" onclick="aAddRev()">Publier les revenus</button>
      </div>`;
  }
  if(tab==='maint'){
    body.innerHTML=`<h3 class="section-title">Ajouter un entretien</h3>
      <div class="admin-form">
        <select id="am-o" class="field"><option value="">— Propriétaire —</option>${oo}</select>
        <select id="am-t" class="field"><option>Ménage</option><option>Plomberie</option><option>Électricité</option><option>Peinture</option><option>Climatisation</option><option>Autre</option></select>
        <input id="am-d" class="field" type="date">
        <select id="am-s" class="field"><option value="planifié">Planifié</option><option value="effectué">Effectué</option></select>
        <input id="am-te" class="field" placeholder="Nom du technicien">
        <textarea id="am-n" class="field" rows="3" placeholder="Description / notes"></textarea>
        <button class="btn-terra" style="margin-top:0" onclick="aAddMaint()">Ajouter l'entretien</button>
      </div>`;
  }
}
const g=id=>document.getElementById(id)?.value||'';
async function aAddInv(){if(!g('ai-o')){toast('Sélectionnez un propriétaire','error');return;}try{await api('POST','/invoices',{ownerId:g('ai-o'),month:g('ai-m'),numero:g('ai-n'),amount:parseFloat(g('ai-a'))||0,date:g('ai-d'),status:g('ai-s')});toast('Facture envoyée ✓','success');}catch(e){toast(e.message,'error');}}
async function aAddRev(){if(!g('ar-o')){toast('Sélectionnez un propriétaire','error');return;}try{await api('POST','/revenues',{ownerId:g('ar-o'),mois:g('ar-m'),annee:parseInt(g('ar-y')),revenuBrut:parseFloat(g('ar-b'))||0,revenuNet:parseFloat(g('ar-n'))||0,tauxOccupation:parseInt(g('ar-oc'))||0,nbLocataires:parseInt(g('ar-l'))||0,nbNuits:parseInt(g('ar-ni'))||0});toast('Revenus publiés ✓','success');}catch(e){toast(e.message,'error');}}
async function aAddMaint(){if(!g('am-o')){toast('Sélectionnez un propriétaire','error');return;}try{await api('POST','/maintenances',{ownerId:g('am-o'),type:g('am-t'),date:g('am-d'),statut:g('am-s'),technicien:g('am-te'),note:g('am-n')});toast('Entretien ajouté ✓','success');}catch(e){toast(e.message,'error');}}

renderAuth();
tryAutoLogin();
</script>
</body>
</html>
