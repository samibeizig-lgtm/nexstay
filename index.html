<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAFAF8">
<title>Nexstay</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --T:#C17F5A;--TD:#9E6240;--TL:rgba(193,127,90,0.13);
  --bg:#F7F5F2;--w:#FFFFFF;--b2:#EDE9E3;--b3:#E2DDD6;
  --tx:#1A1612;--t2:#6B6158;--t3:#ABA39A;
  --gr:#3D8C6E;--gbg:rgba(61,140,110,0.11);
  --re:#C0392B;--rbg:rgba(192,57,43,0.09);
  --am:#B8860B;--abg:rgba(184,134,11,0.1);
  --bd:rgba(0,0,0,0.07);--sh:0 1px 8px rgba(0,0,0,0.07);
  --f:'DM Sans',sans-serif;--fs:'Cormorant Garamond',serif;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ─ APP SHELL ─ */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:var(--bg)}
#hdr{background:var(--w);border-bottom:1px solid var(--bd);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:50}
#scr{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--b2)}

/* ─ NAVBAR ─ KEY FIX: fixed height, equal flex items, no overflow needed ─ */
#nav{
  background:var(--w);
  border-top:1px solid var(--bd);
  display:flex;
  flex-direction:row;
  flex-shrink:0;
  height:58px;
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -2px 12px rgba(0,0,0,0.06);
  z-index:50;
}
/* Each nav button takes equal space */
.nb{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  border:none;
  background:none;
  color:var(--t3);
  font-size:9px;
  font-weight:700;
  font-family:var(--f);
  padding:0;
  cursor:pointer;
  position:relative;
  transition:color .15s;
  min-width:0;
  overflow:hidden;
}
.nb svg{width:20px;height:20px;flex-shrink:0}
.nb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.nb.on{color:var(--T)}
.nb.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--T);border-radius:1px}
.ndot{position:absolute;top:6px;right:25%;width:6px;height:6px;border-radius:50%;background:var(--T);border:1.5px solid var(--w)}

/* ─ AUTH ─ */
#auth{position:fixed;inset:0;background:linear-gradient(150deg,#FAFAF8,#EDE8DF);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;overflow-y:auto}
.ac{width:100%;max-width:390px}
.al{text-align:center;margin-bottom:30px}
.logo-xl .n{font-family:var(--fs);font-size:42px;font-weight:700;color:var(--tx)}
.logo-xl .s{font-family:var(--fs);font-size:42px;font-weight:700;color:var(--T)}
.logo-xl .c{display:block;font-size:10px;letter-spacing:4px;color:var(--t3);margin-top:4px;font-weight:500}
.acard{background:var(--w);border-radius:22px;padding:26px;box-shadow:0 4px 24px rgba(0,0,0,0.1)}
.pb{display:flex;gap:7px;margin-bottom:22px}
.pb i{flex:1;height:2px;border-radius:1px;background:var(--b3);transition:background .3s}
.pb i.on{background:var(--T)}
.at{font-family:var(--fs);font-size:21px;font-weight:700;margin-bottom:3px}
.as{color:var(--t2);font-size:13px;margin-bottom:18px}
.fg{display:flex;flex-direction:column;gap:10px}
.fr{display:flex;gap:9px}
.fi{width:100%;background:var(--b2);border:1.5px solid var(--b3);border-radius:11px;padding:12px 14px;color:var(--tx);font-size:15px;font-family:var(--f);outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--T);background:var(--w)}
select.fi option{background:#fff}
.bt{width:100%;padding:14px;background:var(--T);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;font-family:var(--f);margin-top:16px;transition:background .2s}
.bt:active{background:var(--TD)}
.aswitch{text-align:center;color:var(--t2);font-size:13px;margin-top:15px}
.aswitch b{color:var(--T);cursor:pointer;font-weight:600}
.ahint{text-align:center;color:var(--t3);font-size:11px;margin-top:8px}

/* ─ LOGO SMALL ─ */
.logo-sm .n{font-family:var(--fs);font-size:20px;font-weight:700;color:var(--tx)}
.logo-sm .s{font-family:var(--fs);font-size:20px;font-weight:700;color:var(--T)}
.logo-sm .c{font-size:7.5px;letter-spacing:2px;color:var(--t3);font-weight:500;margin-left:7px;align-self:center;text-transform:uppercase}
.logo-sm{display:flex;align-items:baseline}

/* ─ ICON BTNS ─ */
.hbtn{width:33px;height:33px;border:1.5px solid var(--bd);border-radius:9px;background:var(--w);color:var(--t2);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:var(--sh)}
.hdot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--T);border:1.5px solid var(--w)}

/* ─ PAGE ─ */
.pg{padding:15px 13px 28px}
.st{font-family:var(--fs);font-size:18px;font-weight:700;margin-bottom:11px}

/* ─ HERO CARD ─ */
.hc{background:linear-gradient(135deg,var(--T),var(--TD));border-radius:18px;padding:20px;margin-bottom:13px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(193,127,90,0.28)}
.hc::before{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.1);pointer-events:none}
.hg{color:rgba(255,255,255,0.72);font-size:12px}
.hn{color:#fff;font-family:var(--fs);font-size:23px;font-weight:700;margin-top:3px}
.hco{display:inline-flex;align-items:center;gap:6px;margin-top:11px;background:rgba(255,255,255,0.18);border-radius:8px;padding:6px 11px;color:#fff;font-size:11px;font-weight:600}

/* ─ STAT CARDS ─ */
.sr{display:flex;gap:8px;margin-bottom:8px}
.sc{flex:1;min-width:0;background:var(--w);border:1px solid var(--bd);border-radius:13px;padding:13px;box-shadow:var(--sh)}
.si{font-size:17px;margin-bottom:7px}
.sv{font-size:20px;font-weight:700;line-height:1}
.sl{font-size:10px;color:var(--t2);margin-top:4px}
.ss{font-size:10px;color:var(--T);font-weight:600;margin-top:3px}

/* ─ FEED ─ */
.fc{background:var(--w);border:1px solid var(--bd);border-radius:13px;padding:3px 13px;box-shadow:var(--sh)}
.fi2{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--b2)}
.fi2:last-child{border-bottom:none}
.fic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.ft{flex:1;font-size:13px;font-weight:500;line-height:1.4}
.ftm{font-size:10px;color:var(--t3);flex-shrink:0}

/* ─ BADGES ─ */
.bg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bg-g{background:var(--gbg);color:var(--gr)}
.bg-a{background:var(--abg);color:var(--am)}
.bg-r{background:var(--rbg);color:var(--re)}
.bg-t{background:var(--TL);color:var(--T)}

/* ─ ALERTS ─ */
.al2{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.al-a{background:var(--abg);border:1px solid rgba(184,134,11,0.2)}
.al-r{background:var(--rbg);border:1px solid rgba(192,57,43,0.15)}
.al-g{background:var(--gbg);border:1px solid rgba(61,140,110,0.2)}
.alt{font-size:13px;font-weight:700}
.als{font-size:11px;color:var(--t2);margin-top:2px;line-height:1.5}

/* ─ INVOICES ─ */
.ii{display:flex;align-items:center;gap:11px;padding:13px;background:var(--w);border:1px solid var(--bd);border-radius:13px;box-shadow:var(--sh);transition:border-color .2s}
.ii:active{border-color:var(--T)}
.iic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:19px}
.iim{flex:1;min-width:0}
.iin{font-size:14px;font-weight:600}
.iis{font-size:11px;color:var(--t3);margin-top:1px}
.iia{font-size:14px;font-weight:700;color:var(--T)}

/* ─ DEL BTN ─ */
.dbt{background:var(--rbg);border:1px solid rgba(192,57,43,0.18);color:var(--re);border-radius:9px;padding:8px 10px;font-size:14px;flex-shrink:0;cursor:pointer;display:flex;align-items:center}

/* ─ MONTH PILLS ─ */
.mf{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:13px;scrollbar-width:none}
.mf::-webkit-scrollbar{display:none}
.mb{flex-shrink:0;padding:6px 13px;border-radius:18px;border:1.5px solid var(--b3);background:var(--w);color:var(--t2);font-size:12px;font-weight:600;font-family:var(--f);cursor:pointer;transition:all .2s}
.mb.on{background:var(--T);border-color:var(--T);color:#fff}

/* ─ REV HERO ─ */
.rh{background:var(--w);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:10px;box-shadow:var(--sh)}
.rl{color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase}
.rv{font-family:var(--fs);font-size:34px;font-weight:700;line-height:1.1;margin:5px 0 3px}
.rv span{color:var(--T)}

/* ─ BARS ─ */
.cw{background:var(--w);border:1px solid var(--bd);border-radius:15px;padding:16px;margin-bottom:10px;box-shadow:var(--sh)}
.bs{display:flex;align-items:flex-end;gap:6px;height:80px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.br{width:100%;border-radius:4px 4px 0 0;transition:height .6s ease}
.bl{font-size:9px;color:var(--t3);font-weight:500}

/* ─ RING ─ */
.rr{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.rw{display:flex;flex-direction:column;align-items:center;gap:4px}
.rwl{font-size:10px;color:var(--t2);font-weight:500}

/* ─ REV BREAKDOWN ─ */
.rb{background:var(--w);border:1px solid var(--bd);border-radius:15px;overflow:hidden;box-shadow:var(--sh)}
.rr2{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid var(--b2);font-size:13px}
.rr2:last-child{border-bottom:none}
.rd{width:7px;height:7px;border-radius:50%;margin-right:8px;display:inline-block;flex-shrink:0}

/* ─ MAINTENANCE ─ */
.mi{background:var(--w);border:1px solid var(--bd);border-radius:13px;padding:14px;box-shadow:var(--sh)}
.mih{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.miw{display:flex;align-items:center;gap:9px}
.mic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.mity{font-size:14px;font-weight:700}
.mida{font-size:11px;color:var(--t3);margin-top:1px}
.mino{font-size:12px;color:var(--t2);line-height:1.55;padding-left:47px}
.mite{display:flex;align-items:center;gap:6px;margin-top:8px;padding-left:47px}
.tc{background:var(--TL);color:var(--T);font-size:11px;font-weight:600;padding:2px 9px;border-radius:18px}

/* ─ INFOS ─ */
.is{background:var(--w);border:1px solid var(--bd);border-radius:15px;overflow:hidden;margin-bottom:10px;box-shadow:var(--sh)}
.ish{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--b2);background:var(--bg)}
.ist{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:1px;text-transform:uppercase}
.ir{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--b2);font-size:13px}
.ir:last-child{border-bottom:none}
.irl{color:var(--t2)}
.irv{color:var(--tx);font-weight:500;text-align:right;max-width:55%;line-height:1.4;font-size:12px}
.irv.hi{color:var(--T);font-weight:700;font-size:13px}

/* ─ ADMIN ─ */
.tp{display:flex;background:var(--b2);border-radius:11px;padding:3px;margin-bottom:13px;gap:2px}
.tpb{flex:1;text-align:center;padding:8px 2px;border-radius:9px;border:none;background:transparent;color:var(--t2);font-size:11px;font-weight:700;font-family:var(--f);cursor:pointer;transition:all .18s}
.tpb.on{background:var(--w);color:var(--T);box-shadow:var(--sh)}
.sh2{background:linear-gradient(135deg,var(--T),var(--TD));border-radius:15px;padding:18px;color:#fff;margin-bottom:10px;box-shadow:0 5px 20px rgba(193,127,90,0.28)}
.shv{font-family:var(--fs);font-size:32px;font-weight:700}
.shl{font-size:12px;opacity:.8;margin-top:3px}
.oc{background:var(--w);border:1px solid var(--bd);border-radius:13px;padding:14px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.och{display:flex;justify-content:space-between;align-items:center}
.oa{width:38px;height:38px;border-radius:11px;background:var(--TL);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.oi{flex:1;margin-left:10px}
.on2{font-size:14px;font-weight:700}
.oe{font-size:11px;color:var(--t3);margin-top:1px}

/* ─ FORM SECTION ─ */
.fs2{background:var(--w);border:1px solid var(--bd);border-radius:13px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.fs2h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--b2);background:var(--bg)}
.fs2t{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:1px;text-transform:uppercase}
.fs2b{padding:13px;display:flex;flex-direction:column;gap:9px}
.sep{background:var(--b2);border-radius:8px;padding:9px 11px;font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.8px;text-transform:uppercase}

/* ─ BACK BTN ─ */
.bk{display:flex;align-items:center;gap:7px;background:none;border:none;color:var(--T);font-size:13px;font-weight:600;font-family:var(--f);padding:15px 0 13px;cursor:pointer}

/* ─ UTILS ─ */
.spin{width:26px;height:26px;border:2.5px solid var(--b3);border-top-color:var(--T);border-radius:50%;animation:sp .7s linear infinite;margin:36px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .28s ease both}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-70px);background:var(--tx);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--gr)}
#toast.err{background:var(--re)}
.tc2{background:var(--b3);border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;font-family:var(--f);cursor:pointer;color:var(--t2)}
</style>
</head>
<body>
<div id="toast"></div>

<!-- AUTH -->
<div id="auth">
<div class="ac">
  <div class="al">
    <div class="logo-xl"><span class="n">Nex</span><span class="s">stay</span><span class="c">Conciergerie · Tunisie</span></div>
  </div>
  <div class="acard" id="ac2"></div>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div id="hdr">
    <div class="logo-sm"><span class="n">Nex</span><span class="s">stay</span><span class="c">Conciergerie</span></div>
    <div style="display:flex;gap:7px">
      <button class="hbtn" onclick="goTab('invoices')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="hdot" id="ndot" style="display:none"></span>
      </button>
      <button class="hbtn" onclick="logout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div id="scr"></div>
  <div id="nav">
    <button class="nb on" id="nb-dashboard" onclick="goTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span>Accueil</span>
    </button>
    <button class="nb" id="nb-revenues" onclick="goTab('revenues')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Revenus</span>
    </button>
    <button class="nb" id="nb-invoices" onclick="goTab('invoices')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Factures</span>
      <span class="ndot" id="idot" style="display:none"></span>
    </button>
    <button class="nb" id="nb-maintenance" onclick="goTab('maintenance')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <span>Entretiens</span>
    </button>
    <button class="nb" id="nb-infos" onclick="goTab('infos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Infos</span>
    </button>
  </div>
</div>

<script>
// ══ STATE ══════════════════════════════════════════════════════════════════════
var S={user:null,token:null,authMode:'login',authStep:1,authTmp:{}};
var D={invoices:[],revenues:[],maintenances:[],infos:null,contract:null};
var selInv=null,selRevIdx=null,ownerData=null,ownerTabActive='inv';

// ══ API ════════════════════════════════════════════════════════════════════════
async function api(method,path,body){
  var opts={method,headers:{'Content-Type':'application/json'}};
  if(S.token)opts.headers['Authorization']='Bearer '+S.token;
  if(body)opts.body=JSON.stringify(body);
  var res=await fetch('/api'+path,opts);
  var d=await res.json().catch(function(){return{};});
  if(!res.ok)throw new Error(d.error||'Erreur');
  return d;
}

// ══ TOAST ══════════════════════════════════════════════════════════════════════
function toast(msg,type){
  var el=document.getElementById('toast');
  el.className=type==='ok'?'ok':type==='err'?'err':'';
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show')},3000);
}

// ══ AUTH ═══════════════════════════════════════════════════════════════════════
function rAuth(){
  var c=document.getElementById('ac2');
  if(S.authMode==='login'){
    c.innerHTML='<h2 class="at">Connexion</h2><p class="as">Accédez à votre espace propriétaire</p>'

    c.innerHTML='<div class="pb"><i class="'+(s>=1?'on':'')+'"></i><i class="'+(s>=2?'on':'')+'"></i></div>'
      +'<h2 class="at">'+(s===1?'Créer votre compte':'Votre logement')+'</h2>'
      +'<p class="as">'+(s===1?'Informations personnelles':'Adresse de la propriété')+'</p>'
      +(s===1
        ?'<div class="fg"><div class="fr"><input id="rpr" class="fi" placeholder="Prénom"><input id="rno" class="fi" placeholder="Nom"></div>'
          +'<input id="rem" class="fi" type="email" placeholder="Email">'

          +'<input id="rpw" class="fi" type="password" placeholder="Mot de passe"></div>'
          +'<button class="bt" onclick="nextStep()">Continuer →</button>'
        :'<div class="fg"><input id="rad" class="fi" placeholder="Adresse complète">'
          +'<input id="rvi" class="fi" placeholder="Ville">'
          +'<select id="rty" class="fi"><option value="">Type de bien</option><option>Appartement</option><option>Villa</option><option>Studio</option><option>Duplex</option></select></div>'
          +'<button class="bt" onclick="doRegister()">Créer mon compte</button>')
      +'<p class="aswitch">'+(s===2?'<b onclick="S.authStep=1;rAuth()">← Retour</b> · ':'')+'Déjà inscrit ? <b onclick="swAuth(\'login\')">Se connecter</b></p>';
  }
}
function swAuth(m){S.authMode=m;S.authStep=1;rAuth();}
function v(id){var el=document.getElementById(id);return el?el.value:'';}
function nextStep(){
  if(!v('rem')||!v('rpw')){toast('Remplissez tous les champs','err');return;}
  S.authTmp={prenom:v('rpr'),nom:v('rno'),email:v('rem'),password:v('rpw'),tel:v('rte')};
  S.authStep=2;rAuth();
}
async function doRegister(){
  try{
    var d=await api('POST','/auth/register',Object.assign({},S.authTmp,{adresse:v('rad'),ville:v('rvi'),typeLogement:v('rty')}));
    S.user=d.user;S.token=d.token;localStorage.setItem('nxt',d.token);startApp();
  }catch(e){toast(e.message,'err');}
}
async function doLogin(){
  try{
    var d=await api('POST','/auth/login',{email:v('le'),password:v('lp')});
    S.user=d.user;S.token=d.token;localStorage.setItem('nxt',d.token);startApp();
  }catch(e){toast(e.message,'err');}
}
async function tryAuto(){
  var t=localStorage.getItem('nxt');if(!t)return;
  S.token=t;
  try{S.user=await api('GET','/auth/me');startApp();}
  catch(e){localStorage.removeItem('nxt');}
}
function logout(){
  localStorage.removeItem('nxt');S.user=null;S.token=null;
  document.getElementById('auth').style.display='flex';
  document.getElementById('app').style.display='none';
  rAuth();
}

// ══ START APP ══════════════════════════════════════════════════════════════════
async function startApp(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='flex';
  // Ajouter bouton admin dans navbar si admin
  if(S.user.role==='admin'&&!document.getElementById('nb-admin')){
    var nav=document.getElementById('nav');
    var b=document.createElement('button');
    b.className='nb';b.id='nb-admin';b.onclick=function(){goTab('admin');};
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg><span>Admin</span>';
    nav.appendChild(b);
  }
  await loadData();
  goTab(S.user.role==='admin'?'admin':'dashboard');
}
async function loadData(){
  try{
    var res=await Promise.all([api('GET','/invoices'),api('GET','/revenues'),api('GET','/maintenances'),api('GET','/infos'),api('GET','/contract')]);
    D.invoices=res[0];D.revenues=res[1];D.maintenances=res[2];D.infos=res[3];D.contract=res[4];
    selRevIdx=D.revenues.length-1;
    var p=D.invoices.filter(function(i){return i.status==='en_attente';}).length;
    document.getElementById('idot').style.display=p>0?'block':'none';
    document.getElementById('ndot').style.display=p>0?'block':'none';
  }catch(e){toast('Erreur chargement','err');}
}

// ══ NAVIGATION ══════════════════════════════════════════════════════════════════
function goTab(tab){
  selInv=null;ownerData=null;
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  var nb=document.getElementById('nb-'+tab);if(nb)nb.classList.add('on');
  var c=document.getElementById('scr');c.scrollTop=0;c.innerHTML='';
  var pages={dashboard:rDash,revenues:rRevenues,invoices:rInvoices,maintenance:rMaint,infos:rInfos,admin:rAdmin};
  if(pages[tab])pages[tab](c);
}

// ══ REVENUES ═══════════════════════════════════════════════════════════════════
function rRevenues(c){
  var revs=D.revenues;
  if(!revs.length){c.innerHTML='<div class="pg"><p style="color:var(--t2);text-align:center;padding:40px">Aucun revenu disponible</p></div>';return;}
  if(selRevIdx===null||selRevIdx>=revs.length)selRevIdx=revs.length-1;
  var cur=revs[selRevIdx],prev=revs[selRevIdx-1];
  var trend=prev?(((cur.revenuNet-prev.revenuNet)/prev.revenuNet)*100).toFixed(0):null;
  var mx=Math.max.apply(null,revs.map(function(r){return r.revenuBrut;}));
  c.innerHTML='<div class="pg fu">'
    +'<div class="mf">'+revs.map(function(r,i){return'<button class="mb'+(i===selRevIdx?' on':'')+'" onclick="selR('+i+')">'+r.mois+'</button>';}).join('')+'</div>'
    +'<div class="rh"><div class="rl">Revenu net · '+cur.mois+' '+cur.annee+'</div>'
    +'<div class="rv">'+cur.revenuNet.toLocaleString()+' <span>DT</span></div>'
    +(trend?'<div style="color:'+(trend>0?'var(--gr)':'var(--re)')+';font-size:12px;font-weight:600">'+(trend>0?'↑':'↓')+' '+Math.abs(trend)+'% vs mois précédent</div>':'')+'</div>'
    +'<div class="rr">'+ringSVG(cur.tauxOccupation,'Occupation')
    +'<div style="flex:1;display:flex;flex-direction:column;gap:8px">'
    +'<div class="sc" style="padding:10px"><div class="sv" style="font-size:18px">'+cur.nbLocataires+'</div><div class="sl">Locataires</div></div>'
    +'<div class="sc" style="padding:10px"><div class="sv" style="font-size:18px">'+cur.nbNuits+' j</div><div class="sl">Nuits réservées</div></div>'
    +'</div></div>'
    +'<div class="cw"><h3 class="st" style="font-size:14px;margin-bottom:13px">Évolution des revenus</h3>'
    +'<div class="bs">'+revs.map(function(r,i){return'<div class="bc"><div class="br" style="height:'+Math.round((r.revenuBrut/mx)*68)+'px;background:'+(i===selRevIdx?'var(--T)':'var(--b3)')+'"></div><span class="bl">'+r.mois.slice(0,3)+'</span></div>';}).join('')+'</div></div>'
    +'<h3 class="st">Répartition</h3><div class="rb">'
    +'<div class="rr2"><span><span class="rd" style="background:var(--T)"></span><span style="color:var(--t2)">Revenus bruts Airbnb</span></span><span style="color:var(--T);font-weight:700">+'+cur.revenuBrut.toLocaleString()+' DT</span></div>'
    +'<div class="rr2"><span><span class="rd" style="background:var(--re)"></span><span style="color:var(--t2)">Commission Nexstay (20%)</span></span><span style="color:var(--re);font-weight:700">-'+Math.round(cur.revenuBrut*.2).toLocaleString()+' DT</span></div>'
    +'<div class="rr2"><span><span class="rd" style="background:var(--am)"></span><span style="color:var(--t2)">Charges & entretien</span></span><span style="color:var(--am);font-weight:700">-'+(cur.revenuBrut-cur.revenuNet-Math.round(cur.revenuBrut*.2)).toLocaleString()+' DT</span></div>'
    +'<div class="rr2" style="background:var(--bg)"><span style="font-weight:700">💰 Revenu net</span><span style="color:var(--T);font-weight:700;font-size:15px">'+cur.revenuNet.toLocaleString()+' DT</span></div>'
    +'</div></div>';
}
function selR(i){selRevIdx=i;rRevenues(document.getElementById('scr'));}
function ringSVG(val,label){
  var r=32,circ=2*Math.PI*r,off=circ-((val/100)*circ);
  return'<div class="rw"><svg width="80" height="80"><circle cx="40" cy="40" r="'+r+'" fill="none" stroke="var(--b3)" stroke-width="7"/>'
    +'<circle cx="40" cy="40" r="'+r+'" fill="none" stroke="var(--T)" stroke-width="7" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" stroke-linecap="round" transform="rotate(-90 40 40)"/>'
    +'<text x="50%" y="50%" text-anchor="middle" dy=".35em" fill="var(--T)" font-size="13" font-weight="700" font-family="DM Sans,sans-serif">'+val+'%</text></svg>'
    +'<span class="rwl">'+label+'</span></div>';
}

      +['Fournisseur|'+(inf.internet&&inf.internet.fournisseur||'—'),'N° Contrat|'+(inf.internet&&inf.internet.numero||'—')+'|hi','Fin abonnement|'+(inf.internet&&inf.internet.dateFin||'—')].map(function(r){var p=r.split('|');return'<div class="ir"><span class="irl">'+p[0]+'</span><span class="irv'+(p[2]?' hi':'')+'">'+(p[1]||'—')+'</span></div>';}).join('')+'</div>'
      +'<div class="is"><div class="ish"><span>📺</span><span class="ist">TV / Abonnement</span></div>'
      +['Abonnement|'+(inf.tv&&inf.tv.abonnement||'—'),'Référence|'+(inf.tv&&inf.tv.reference||'—')+'|hi','Date de fin|'+(inf.tv&&inf.tv.dateFin||'—')].map(function(r){var p=r.split('|');return'<div class="ir"><span class="irl">'+p[0]+'</span><span class="irv'+(p[2]?' hi':'')+'">'+(p[1]||'—')+'</span></div>';}).join('')+'</div>'
      :'<div class="is"><div style="text-align:center;padding:26px;color:var(--t2)">Informations non encore renseignées</div></div>')
    +'</div>';
}

// ══ ADMIN ══════════════════════════════════════════════════════════════════════
async function rAdmin(c){
  c.innerHTML='<div class="pg"><div class="spin"></div></div>';
  var stats={},owners=[];
  try{var r=await Promise.all([api('GET','/stats'),api('GET','/owners')]);stats=r[0];owners=r[1];}catch(e){}
  window._ow=owners;window._st=stats;
  if(ownerData){rOwnerDetail(c,ownerData);return;}
  rOwnerList(c,owners,stats);
}

function rOwnerList(c,owners,stats){
  c.innerHTML='<div class="pg fu">'
    +'<div class="sh2"><div class="shv">'+(stats.totalRevenue||0).toLocaleString()+' DT</div><div class="shl">Total revenus nets cumulés</div></div>'
    +'<div class="sr"><div class="sc"><div class="si">👤</div><div class="sv">'+(stats.totalOwners||0)+'</div><div class="sl">Propriétaires</div></div>'
    +'<div class="sc"><div class="si">⏳</div><div class="sv" style="color:var(--T)">'+(stats.pendingInvoices||0)+'</div><div class="sl">Factures en attente</div></div></div>'
    +'<div class="sr"><div class="sc"><div class="si">🧾</div><div class="sv">'+(stats.totalInvoices||0)+'</div><div class="sl">Total factures</div></div>'
    +'<div class="sc"><div class="si">🔧</div><div class="sv" style="color:var(--am)">'+(stats.maintenancePending||0)+'</div><div class="sl">Entretiens planifiés</div></div></div>'
    +'<h3 class="st" style="margin-top:6px">Propriétaires ('+owners.length+')</h3>'
    +owners.map(function(o){
      return'<div class="oc" onclick="openOwner(\''+o.id+'\')">'
        +'<div class="och"><div class="oa">👤</div>'
        +'<div class="oi"><div class="on2">'+o.prenom+' '+o.nom+'</div><div class="oe">'+o.email+'</div></div>'
        +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,18 15,12 9,6"/></svg></div>'
        +'<div style="display:flex;gap:7px;margin-top:9px">'
        +'<div style="flex:1;background:var(--b2);border-radius:8px;padding:7px;text-align:center"><div style="font-size:12px;font-weight:700;color:var(--T)">'+(o.ville||'—')+'</div><div style="font-size:9px;color:var(--t2)">Ville</div></div>'
        +'<div style="flex:1;background:var(--b2);border-radius:8px;padding:7px;text-align:center"><div style="font-size:12px;font-weight:700;color:var(--T)">'+(o.typeLogement||'—')+'</div><div style="font-size:9px;color:var(--t2)">Bien</div></div>'
        +'<div style="flex:1;background:var(--b2);border-radius:8px;padding:7px;text-align:center"><div style="font-size:11px;font-weight:700;color:var(--T)">'+(o.tel||'—')+'</div><div style="font-size:9px;color:var(--t2)">Tél</div></div>'
        +'</div></div>';
    }).join('')
    +'</div>';
}

async function openOwner(id){
  var c=document.getElementById('scr');
  c.innerHTML='<div class="pg"><div class="spin"></div></div>';
  try{
    var d=await api('GET','/owner-data/'+id);
    ownerData=d;ownerTabActive='inv';
    rOwnerDetail(c,d);
  }catch(e){toast(e.message,'err');}
}

function rOwnerDetail(c,d){
  var o=d.owner||{};
  c.innerHTML='<div class="pg fu">'
    +'<button class="bk" onclick="ownerData=null;rAdmin(document.getElementById(\'scr\'))">← Tous les propriétaires</button>'
    +'<div class="hc" style="margin-bottom:13px"><p class="hg">Propriétaire</p><h2 class="hn">'+o.prenom+' '+o.nom+'</h2>'
    +'<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap"><div class="hco">📧 '+o.email+'</div><div class="hco">📞 '+(o.tel||'—')+'</div></div></div>'
    +'<div class="tp" id="oTabs">'
    +'<button class="tpb'+(ownerTabActive==='inv'?' on':'')+'" onclick="oTab(\'inv\')">Factures</button>'
    +'<button class="tpb'+(ownerTabActive==='rev'?' on':'')+'" onclick="oTab(\'rev\')">Revenus</button>'
    +'<button class="tpb'+(ownerTabActive==='maint'?' on':'')+'" onclick="oTab(\'maint\')">Entretiens</button>'
    +'<button class="tpb'+(ownerTabActive==='infos'?' on':'')+'" onclick="oTab(\'infos\')">Infos</button>'
    +'</div>'
    +'<div id="oBody"></div>'
    +'</div>';
  oTab(ownerTabActive);
}

function oTab(tab){
  ownerTabActive=tab;
  document.querySelectorAll('.tpb').forEach(function(b){b.classList.remove('on');});
  var found=false;
  document.querySelectorAll('.tpb').forEach(function(b){
    if(!found&&((tab==='inv'&&b.textContent==='Factures')||(tab==='rev'&&b.textContent==='Revenus')||(tab==='maint'&&b.textContent==='Entretiens')||(tab==='infos'&&b.textContent==='Infos'))){b.classList.add('on');found=true;}
  });
  var body=document.getElementById('oBody');if(!body)return;
  var d=ownerData||{};
  var invs=d.invoices||[],revs=d.revenues||[],maints=d.maintenances||[],inf=d.infos||null;
  var oid=(d.owner||{}).id||'';
  var ic={Ménage:'🧹',Plomberie:'🔧','Électricité':'⚡',Peinture:'🎨',Climatisation:'❄️',Autre:'🔨'};

  if(tab==='inv'){
    body.innerHTML=
      // FORMULAIRE AJOUT FACTURE
      '<div class="fs2"><div class="fs2h"><span>➕</span><span class="fs2t">Nouvelle facture</span></div>'
      +'<div class="fs2b">'
      +'<input id="ai-m" class="fi" placeholder="Période (ex: Mai 2025)">'
      +'<input id="ai-n" class="fi" placeholder="Numéro (ex: F-2025-005)">'
      +'<div style="display:flex;gap:8px"><input id="ai-a" class="fi" type="number" placeholder="Montant DT"><input id="ai-d" class="fi" type="date"></div>'
      +'<select id="ai-s" class="fi"><option value="en_attente">En attente</option><option value="payée">Payée</option></select>'
      +'<button class="bt" style="margin-top:0" onclick="aAddInv(\''+oid+'\')">Envoyer la facture</button>'
      +'</div></div>'
      // LISTE FACTURES
      +'<h3 class="st">Factures ('+invs.length+')</h3>'
      +(invs.length===0?'<p style="color:var(--t2);font-size:13px;padding:8px 0">Aucune facture</p>':'')
      +invs.map(function(inv){
        return'<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">'
          +'<div class="ii" style="flex:1"><div class="iic" style="background:'+(inv.status==='payée'?'var(--gbg)':'var(--abg)')+'">'+  (inv.status==='payée'?'✅':'⏳')+'</div>'
          +'<div class="iim"><div class="iin">'+(inv.month||inv.mois)+'</div><div class="iis">'+inv.numero+'</div></div>'
          +'<div style="text-align:right"><div class="iia">'+(inv.amount||0).toLocaleString()+' DT</div>'
          +'<span class="bg '+(inv.status==='payée'?'bg-g':'bg-a')+'" style="margin-top:3px">'+(inv.status==='payée'?'✓ Payée':'⏳ Attente')+'</span></div></div>'
          +'<button class="dbt" onclick="aDelInv(\''+inv.id+'\',\''+oid+'\')">🗑</button>'
          +'</div>';
      }).join('');
  }

  if(tab==='rev'){
    body.innerHTML=
      // FORMULAIRE AJOUT REVENU
      '<div class="fs2"><div class="fs2h"><span>➕</span><span class="fs2t">Publier des revenus</span></div>'
      +'<div class="fs2b">'
      +'<div style="display:flex;gap:8px"><input id="ar-m" class="fi" placeholder="Mois (ex: Juin)"><input id="ar-y" class="fi" type="number" placeholder="Année" value="2025"></div>'
      +'<div style="display:flex;gap:8px"><input id="ar-b" class="fi" type="number" placeholder="Revenu brut DT"><input id="ar-n" class="fi" type="number" placeholder="Revenu net DT"></div>'
      +'<div style="display:flex;gap:8px"><input id="ar-oc" class="fi" type="number" placeholder="Occupation %" min="0" max="100"><input id="ar-l" class="fi" type="number" placeholder="Nb locataires"></div>'
      +'<input id="ar-ni" class="fi" type="number" placeholder="Nb nuits réservées">'
      +'<button class="bt" style="margin-top:0" onclick="aAddRev(\''+oid+'\')">Publier les revenus</button>'
      +'</div></div>'
      // LISTE REVENUS
      +'<h3 class="st">Revenus ('+revs.length+')</h3>'
      +(revs.length===0?'<p style="color:var(--t2);font-size:13px;padding:8px 0">Aucun revenu</p>':'')
      +revs.map(function(r){
        return'<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">'
          +'<div class="rh" style="flex:1;margin-bottom:0;padding:13px"><div class="rl">'+r.mois+' '+r.annee+'</div>'
          +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">'
          +'<span style="font-family:var(--fs);font-size:20px;font-weight:700;color:var(--T)">'+r.revenuNet.toLocaleString()+' DT</span>'
          +'<span class="bg bg-t">'+r.tauxOccupation+'% occ.</span></div></div>'
          +'<button class="dbt" onclick="aDelRev(\''+r.id+'\',\''+oid+'\')">🗑</button>'
          +'</div>';
      }).join('');
  }

  if(tab==='maint'){
    body.innerHTML=
      // FORMULAIRE AJOUT ENTRETIEN
      '<div class="fs2"><div class="fs2h"><span>➕</span><span class="fs2t">Ajouter un entretien</span></div>'
      +'<div class="fs2b">'
      +'<select id="am-t" class="fi"><option>Ménage</option><option>Plomberie</option><option>Électricité</option><option>Peinture</option><option>Climatisation</option><option>Autre</option></select>'
      +'<div style="display:flex;gap:8px"><input id="am-d" class="fi" type="date"><select id="am-s" class="fi"><option value="planifié">Planifié</option><option value="effectué">Effectué</option></select></div>'
      +'<input id="am-te" class="fi" placeholder="Nom du technicien">'
      +'<textarea id="am-n" class="fi" rows="2" placeholder="Description / notes"></textarea>'
      +'<button class="bt" style="margin-top:0" onclick="aAddMaint(\''+oid+'\')">Ajouter l\'entretien</button>'
      +'</div></div>'
      // LISTE ENTRETIENS
      +'<h3 class="st">Entretiens ('+maints.length+')</h3>'
      +(maints.length===0?'<p style="color:var(--t2);font-size:13px;padding:8px 0">Aucun entretien</p>':'')
      +maints.map(function(m){
        return'<div style="display:flex;align-items:flex-start;gap:7px;margin-bottom:8px">'
          +'<div class="mi" style="flex:1"><div class="mih"><div class="miw"><div class="mic" style="background:'+(m.statut==='effectué'?'var(--gbg)':'var(--TL)')+'">'+  (ic[m.type]||'🔨')+'</div>'
          +'<div><div class="mity">'+m.type+'</div><div class="mida">'+(m.date||'').slice(0,10)+'</div></div></div>'
          +'<span class="bg '+(m.statut==='effectué'?'bg-g':'bg-a')+'">'+(m.statut==='effectué'?'✓ Fait':'⏳ Planifié')+'</span></div>'
          +'<p class="mino">'+(m.note||'')+'</p>'
          +(m.technicien?'<div class="mite"><span class="tc">👤 '+m.technicien+'</span></div>':'')
          +'</div>'
          +'<button class="dbt" style="margin-top:3px" onclick="aDelMaint(\''+m.id+'\',\''+oid+'\')">🗑</button>'
          +'</div>';
      }).join('');
  }

  if(tab==='infos'){
    var i=inf||{};
    body.innerHTML=
      '<div class="fs2"><div class="fs2h"><span>✏️</span><span class="fs2t">Informations logement</span></div>'
      +'<div class="fs2b">'
      +'<input id="ii-adr" class="fi" placeholder="Adresse" value="'+(i.adresse||'')+'">'
      +'<div style="display:flex;gap:8px"><input id="ii-et" class="fi" placeholder="Étage" value="'+(i.etage||'')+'"><input id="ii-sup" class="fi" placeholder="Superficie" value="'+(i.superficie||'')+'"></div>'
      +'<input id="ii-cl" class="fi" type="number" placeholder="Nombre de clés" value="'+(i.nbCles||'')+'">'
      +'<div class="sep">INTERNET</div>'
      +'<div style="display:flex;gap:8px"><input id="ii-if" class="fi" placeholder="Fournisseur" value="'+((i.internet&&i.internet.fournisseur)||'')+'"><input id="ii-in" class="fi" placeholder="N° contrat" value="'+((i.internet&&i.internet.numero)||'')+'"></div>'
      +'<input id="ii-id" class="fi" type="date" value="'+((i.internet&&i.internet.dateFin)||'')+'">'
      +'<div class="sep">TV / ABONNEMENT</div>'
      +'<div style="display:flex;gap:8px"><input id="ii-ta" class="fi" placeholder="Abonnement" value="'+((i.tv&&i.tv.abonnement)||'')+'"><input id="ii-tr" class="fi" placeholder="Référence" value="'+((i.tv&&i.tv.reference)||'')+'"></div>'
      +'<input id="ii-td" class="fi" type="date" value="'+((i.tv&&i.tv.dateFin)||'')+'">'
      +'<textarea id="ii-no" class="fi" rows="2" placeholder="Notes (code digicode, etc.)">'+(i.autresInfos||'')+'</textarea>'
      +'<button class="bt" style="margin-top:0" onclick="aSaveInfos(\''+oid+'\')">💾 Enregistrer les informations</button>'
      +'</div></div>';
  }
}

// ══ ADMIN ACTIONS ══════════════════════════════════════════════════════════════
function gv(id){var e=document.getElementById(id);return e?e.value:'';}

async function aAddInv(oid){
  var m=gv('ai-m'),n=gv('ai-n'),a=parseFloat(gv('ai-a'))||0,d=gv('ai-d'),s=gv('ai-s');
  if(!m||!n){toast('Remplissez la période et le numéro','err');return;}
  try{
    var inv=await api('POST','/invoices',{ownerId:oid,month:m,numero:n,amount:a,date:d,status:s});
    ownerData.invoices.unshift(inv);toast('Facture envoyée ✓','ok');oTab('inv');
  }catch(e){toast(e.message,'err');}
}
async function aDelInv(id,oid){
  if(!confirm('Supprimer cette facture ?'))return;
  try{
    await api('DELETE','/invoices/'+id);
    ownerData.invoices=ownerData.invoices.filter(function(i){return i.id!==id;});
    toast('Supprimée','ok');oTab('inv');
  }catch(e){toast(e.message,'err');}
}
async function aAddRev(oid){
  var m=gv('ar-m');
  if(!m){toast('Indiquez le mois','err');return;}
  try{
    var rev=await api('POST','/revenues',{ownerId:oid,mois:m,annee:parseInt(gv('ar-y'))||2025,revenuBrut:parseFloat(gv('ar-b'))||0,revenuNet:parseFloat(gv('ar-n'))||0,tauxOccupation:parseInt(gv('ar-oc'))||0,nbLocataires:parseInt(gv('ar-l'))||0,nbNuits:parseInt(gv('ar-ni'))||0});
    ownerData.revenues.push(rev);toast('Revenus publiés ✓','ok');oTab('rev');
  }catch(e){toast(e.message,'err');}
}
async function aDelRev(id,oid){
  if(!confirm('Supprimer ces revenus ?'))return;
  try{
    await api('DELETE','/revenues/'+id);
    ownerData.revenues=ownerData.revenues.filter(function(r){return r.id!==id;});
    toast('Supprimés','ok');oTab('rev');
  }catch(e){toast(e.message,'err');}
}
async function aAddMaint(oid){
  try{
    var m=await api('POST','/maintenances',{ownerId:oid,type:gv('am-t'),date:gv('am-d'),statut:gv('am-s'),technicien:gv('am-te'),note:gv('am-n')});
    ownerData.maintenances.unshift(m);toast('Entretien ajouté ✓','ok');oTab('maint');
  }catch(e){toast(e.message,'err');}
}
async function aDelMaint(id,oid){
  if(!confirm('Supprimer cet entretien ?'))return;
  try{
    await api('DELETE','/maintenances/'+id);
    ownerData.maintenances=ownerData.maintenances.filter(function(m){return m.id!==id;});
    toast('Supprimé','ok');oTab('maint');
  }catch(e){toast(e.message,'err');}
}
async function aSaveInfos(oid){
  var body={ownerId:oid,adresse:gv('ii-adr'),etage:gv('ii-et'),superficie:gv('ii-sup'),nbCles:parseInt(gv('ii-cl'))||0,
    internet:{fournisseur:gv('ii-if'),numero:gv('ii-in'),dateFin:gv('ii-id')},
    tv:{abonnement:gv('ii-ta'),reference:gv('ii-tr'),dateFin:gv('ii-td')},
    autresInfos:gv('ii-no')};
  try{
    var inf=await api('PUT','/infos',body);
    ownerData.infos=inf;toast('Informations enregistrées ✓','ok');
  }catch(e){toast(e.message,'err');}
}

// ══ INIT ═══════════════════════════════════════════════════════════════════════
rAuth();
tryAuto();
</script>
